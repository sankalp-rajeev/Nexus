name: Publish

# Runs only when a version tag is pushed. Tags containing "rc" go to TestPyPI; all other v* tags
# go to PyPI. Publishing uses PyPI Trusted Publishing (OIDC): no API token or secret is stored
# anywhere. The "pypi" environment must require a manual approval (configured in the GitHub
# repository settings, not here).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install build tools
        run: |
          python3 -m venv .release-venv
          .release-venv/bin/python -m pip install --upgrade pip
          .release-venv/bin/python -m pip install build twine

      - name: Build sdist and wheel
        run: .release-venv/bin/python -m build sdk

      - name: twine check
        run: .release-venv/bin/python -m twine check --strict sdk/dist/*

      - name: Tag matches pyproject version; wheel holds only nexus_llmops/** and nexus_agent/**
        run: >
          .release-venv/bin/python scripts/phase6/check_dist.py
          --dist sdk/dist --pyproject sdk/pyproject.toml --tag "$GITHUB_REF_NAME"

      # actions/upload-artifact v7.0.2
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: dist
          path: sdk/dist/
          if-no-files-found: error

  publish-testpypi:
    needs: build
    if: contains(github.ref_name, 'rc')
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish v1.14.3
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-pypi:
    needs: build
    if: ${{ !contains(github.ref_name, 'rc') }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      # actions/download-artifact v8.0.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: dist
          path: dist/

      # pypa/gh-action-pypi-publish v1.14.3
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086
        with:
          packages-dir: dist/
