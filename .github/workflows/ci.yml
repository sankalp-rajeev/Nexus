name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Lint + unit/e2e tests with coverage (primary gate, no external services) ──
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdk
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Type-check (mypy, non-blocking)
        run: mypy sdk/nexus_agent/ --ignore-missing-imports
        continue-on-error: true

      - name: Unit + e2e tests with coverage
        env:
          # Force deterministic mock LLM paths (no real API calls in CI)
          GEMINI_API_KEY: ""
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: |
          pytest tests/unit/ tests/e2e/ -v \
            --cov --cov-config=.coveragerc \
            --cov-report=xml --cov-report=term-missing

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
        continue-on-error: true

  # ── Integration tests against real Kafka + Postgres + Redis ──────────────────
  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ./sdk
          pip install -r requirements-dev.txt

      - name: Start infra (Kafka + Postgres + Redis)
        run: docker compose up -d kafka postgres redis

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if docker compose exec -T postgres pg_isready -U nexus >/dev/null 2>&1; then
              echo "Postgres ready"; break
            fi
            echo "waiting for postgres ($i)"; sleep 2
          done

      - name: Wait for Kafka
        run: sleep 20

      - name: Run integration tests
        env:
          GEMINI_API_KEY: ""
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "55432"
          KAFKA_BOOTSTRAP_SERVERS: localhost:29092
          REDIS_HOST: localhost
          REDIS_PORT: "6379"
        run: pytest tests/integration/ -v --timeout=90

      - name: Tear down infra
        if: always()
        run: docker compose down -v
