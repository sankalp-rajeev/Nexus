[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-llmops"
version = "0.1.0"
description = "Python SDK for Nexus: fail-open agent tracing for the Nexus failure-detection and fix-verification service"
readme = "README.md"
license = { text = "MIT" }
license-files = ["LICENSE"]
authors = [{ name = "Sankalp Rajeev", email = "srajeev@umich.edu" }]
keywords = ["llmops", "agents", "observability", "tracing", "mlops", "ai", "langchain", "crewai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

# nexus_llmops is the package. nexus_agent is a compatibility alias that maps onto it (the
# Nexus research code imports that name); both ship in the wheel, nothing else does.
[tool.hatch.build.targets.wheel]
packages = ["nexus_llmops", "nexus_agent"]

[tool.hatch.build.targets.sdist]
include = ["nexus_llmops", "nexus_agent", "README.md", "LICENSE", "pyproject.toml"]

[project.urls]
Homepage = "https://github.com/sankalp-rajeev/Nexus"
Repository = "https://github.com/sankalp-rajeev/Nexus"
"Bug Tracker" = "https://github.com/sankalp-rajeev/Nexus/issues"
