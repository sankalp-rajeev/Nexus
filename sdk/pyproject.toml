[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexus-selfheal"
version = "0.1.0"
description = "Zero-config observability and autonomous self-healing SDK for multi-agent AI pipelines"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Sankalp Rajeev", email = "srajeev@umich.edu" }]
keywords = ["llmops", "agents", "observability", "mlops", "ai", "langchain", "crewai", "self-healing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.optional-dependencies]
langchain = ["langchain>=0.2", "langchain-core>=0.2"]
crewai = ["crewai>=0.51"]
all = ["nexus-selfheal[langchain,crewai]"]

[tool.hatch.build.targets.wheel]
packages = ["nexus_agent"]

[project.urls]
Homepage = "https://github.com/sankalp-rajeev/Nexus"
Repository = "https://github.com/sankalp-rajeev/Nexus"
"Bug Tracker" = "https://github.com/sankalp-rajeev/Nexus/issues"
