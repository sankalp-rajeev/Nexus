# Nexus — full stack (11 services). Section 4.2.
# App services wait for healthy infra and restart on failure, because several
# connect to Postgres/Kafka once at startup.

services:
  # ── Infrastructure ──────────────────────────────────────────────────
  kafka:
    # NOTE: PRD specified bitnami/kafka:3.6, but Bitnami discontinued its free
    # public catalog tags (2025). Using the official Apache image in KRaft mode.
    # Dual listeners: PLAINTEXT (kafka:9092) for containers, EXTERNAL
    # (localhost:29092) for host-based tooling/tests.
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  postgres:
    image: timescale/timescaledb:latest-pg15
    ports:
      - "55432:5432" # host 55432 to avoid colliding with a local Postgres on 5432
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-nexus}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-nexus_dev_password}"
      POSTGRES_DB: "${POSTGRES_DB:-nexus}"
    volumes:
      - ./infra/init/postgres_init.sql:/docker-entrypoint-initdb.d/postgres_init.sql:ro
      - nexus_pgdata:/var/lib/postgresql/data
    healthcheck:
      # -h 127.0.0.1: the first-boot init server listens on the socket only, so
      # this stays unhealthy until the real server is up after init.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER:-nexus} -d $${POSTGRES_DB:-nexus}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.13.0
    ports:
      - "5000:5000"
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --default-artifact-root /mlflow/artifacts
    volumes:
      - nexus_mlflow:/mlflow

  # ── Nexus application services ───────────────────────────────────────
  nexus-collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    ports:
      - "8000:8000"
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}

  nexus-assembler:
    build:
      context: .
      dockerfile: services/assembler/Dockerfile
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  nexus-classifier:
    build:
      context: .
      dockerfile: services/classifier/Dockerfile
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  nexus-critic:
    build:
      context: .
      dockerfile: services/critic/Dockerfile
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      kafka: {condition: service_healthy}
      postgres: {condition: service_healthy}

  nexus-healer:
    build:
      context: .
      dockerfile: services/healer/Dockerfile
    env_file: [.env]
    environment:
      # Off unless set: evaluate and log proposals, never apply them. true = legacy, unverified (no gate).
      NEXUS_HEALER_AUTO_APPLY: ${NEXUS_HEALER_AUTO_APPLY:-false}
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      mlflow: {condition: service_started}

  nexus-api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    ports:
      - "8001:8001"
    env_file: [.env]
    restart: unless-stopped
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  nexus-dashboard:
    build:
      context: .
      dockerfile: dashboard/Dockerfile
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on: [nexus-api]

volumes:
  nexus_pgdata:
  nexus_mlflow:
